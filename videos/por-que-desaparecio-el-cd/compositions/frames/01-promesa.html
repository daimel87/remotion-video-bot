<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Frame 1 — La promesa</title>
  </head>
  <body>
    <template>
      <style>
        @import url("assets/fonts.css");

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: transparent;
          font-family: 'Barlow', sans-serif;
        }

        /* Full-bleed ink ground */
        #bg {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(120% 90% at 50% 32%, #15100b 0%, #0E0B08 62%, #080604 100%);
        }

        /* Kicker — mono year, top */
        #kicker-clip {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          padding-top: 210px;
        }
        .kicker-wrap {
          position: relative;
          display: inline-flex;
          align-items: center;
        }
        .kicker-mask {
          overflow: hidden;
          white-space: nowrap;
        }
        .kicker {
          font-family: 'IBM Plex Mono', monospace;
          font-weight: 500;
          font-size: 44px;
          letter-spacing: 0.42em;
          color: #E8B04B;
          white-space: nowrap;
          padding-left: 0.42em;
        }
        .caret {
          width: 4px;
          height: 46px;
          margin-left: 2px;
          background: #E8B04B;
        }

        /* Ring — abstract CD */
        #ring-clip {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          padding-top: 360px;
        }
        #ring-svg {
          width: 560px;
          height: 560px;
          transform-origin: 280px 280px;
          overflow: visible;
        }
        .ring-main {
          fill: none;
          stroke: #E8B04B;
          stroke-width: 11;
          stroke-linecap: round;
        }
        .ring-inner {
          fill: none;
          stroke: rgba(232, 176, 75, 0.28);
          stroke-width: 2;
        }
        .ring-outer {
          fill: none;
          stroke: rgba(232, 176, 75, 0.16);
          stroke-width: 2;
        }
        .ring-hole {
          fill: none;
          stroke: rgba(232, 176, 75, 0.5);
          stroke-width: 3;
        }
        #sweep {
          fill: none;
          stroke: #F4E9D6;
          stroke-width: 13;
          stroke-linecap: round;
          transform-origin: 280px 280px;
        }

        /* Headline — Barlow 900 lowercase, mask reveal */
        #head-clip {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: flex-start;
          align-items: center;
          padding-top: 1040px;
          gap: 6px;
        }
        .line-mask {
          overflow: hidden;
          padding: 0 8px;
        }
        .line {
          display: block;
          font-family: 'Barlow', sans-serif;
          font-weight: 900;
          text-transform: lowercase;
          letter-spacing: -0.035em;
          line-height: 1.0;
          color: #F4E9D6;
          white-space: nowrap;
        }
        .line-1 { font-size: 116px; }
        .line-2 { font-size: 116px; color: #E8B04B; }

        .rule {
          width: 44px;
          height: 3px;
          background: #E8B04B;
          margin-top: 30px;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-promesa"
        data-start="0"
        data-duration="5"
        data-width="1080"
        data-height="1920"
      >
        <!-- Full-bleed background -->
        <div id="bg" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>

        <!-- Kicker year -->
        <div id="kicker-clip" class="clip" data-start="0" data-duration="5" data-track-index="1">
          <div class="kicker-wrap">
            <div class="kicker-mask">
              <span class="kicker">1982</span>
            </div>
            <span id="caret" class="caret"></span>
          </div>
        </div>

        <!-- Ring / CD -->
        <div id="ring-clip" class="clip" data-start="0" data-duration="5" data-track-index="2">
          <svg id="ring-svg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
            <circle class="ring-outer" cx="280" cy="280" r="272" />
            <circle class="ring-inner" cx="280" cy="280" r="236" />
            <circle id="ring-main" class="ring-main" cx="280" cy="280" r="254" />
            <circle id="sweep" cx="280" cy="280" r="254" />
            <circle class="ring-hole" cx="280" cy="280" r="46" />
          </svg>
        </div>

        <!-- Headline thesis -->
        <div id="head-clip" class="clip" data-start="0" data-duration="5" data-track-index="3">
          <div class="line-mask"><span class="line line-1" id="line-1">sonido perfecto</span></div>
          <div class="line-mask"><span class="line line-2" id="line-2">para siempre</span></div>
          <div class="rule" id="rule"></div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // Prepare ring draw-on
        const ringMain = document.getElementById('ring-main');
        const ringLen = ringMain.getTotalLength();
        ringMain.style.strokeDasharray = `${ringLen}`;
        ringMain.style.strokeDashoffset = `${ringLen}`;

        // Prepare sweep as a short bright arc on the ring
        const sweep = document.getElementById('sweep');
        const sweepLen = sweep.getTotalLength();
        sweep.style.strokeDasharray = `${sweepLen * 0.16} ${sweepLen}`;
        sweep.style.opacity = 0;

        // Kicker typewriter width target
        const kicker = document.querySelector('.kicker-mask');
        const kickerFull = kicker.getBoundingClientRect
          ? kicker.scrollWidth
          : 120;

        const tl = gsap.timeline({ paused: true });

        // --- Scene 1 (0.0–1.4s): ring draws on, hero visible early ---
        tl.fromTo('#ring-svg', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0.0);
        tl.to('#ring-main', { strokeDashoffset: 0, duration: 1.25, ease: 'power2.out' }, 0.1);

        // Continuous slow rotation of the whole disc across the full shot
        tl.fromTo('#ring-svg', { rotation: -8 }, { rotation: 46, duration: 5, ease: 'none' }, 0.0);

        // Highlight sweep across the ring surface
        tl.set('#sweep', { opacity: 1 }, 1.0);
        tl.fromTo('#sweep', { rotation: -110, svgOrigin: '280 280' }, { rotation: 250, svgOrigin: '280 280', duration: 1.5, ease: 'power2.inOut' }, 1.0);
        tl.to('#sweep', { opacity: 0, duration: 0.4, ease: 'power1.out' }, 2.35);

        // --- Kicker typewriter (0.4–1.1s) ---
        tl.fromTo(kicker, { width: 0 }, { width: kickerFull, duration: 0.55, ease: 'steps(4)' }, 0.5);
        tl.fromTo('#caret', { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: 'steps(1)' }, 1.15);

        // --- Scene 2 (1.7–3.6s): headline falls line by line, mask reveal bottom-to-top ---
        tl.fromTo('#line-1', { yPercent: 115 }, { yPercent: 0, duration: 0.75, ease: 'power3.out' }, 1.8);
        tl.fromTo('#line-2', { yPercent: 115 }, { yPercent: 0, duration: 0.75, ease: 'power3.out' }, 2.65);

        // Accent rule stub settles in last
        tl.fromTo('#rule', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power2.out', transformOrigin: 'center' }, 3.5);

        window.__timelines['01-promesa'] = tl;
      </script>
    </template>
  </body>
</html>
