<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Parchment texture pattern -->
    <pattern id="parchTex" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#F5E6C8"/>
      <g opacity="0.08" fill="#5D4037">
        <circle cx="20" cy="30" r="1.5"/>
        <circle cx="80" cy="10" r="1"/>
        <circle cx="150" cy="50" r="2"/>
        <circle cx="40" cy="90" r="1"/>
        <circle cx="120" cy="80" r="1.5"/>
        <circle cx="180" cy="120" r="1"/>
        <circle cx="60" cy="140" r="2"/>
        <circle cx="100" cy="170" r="1"/>
        <circle cx="160" cy="160" r="1.5"/>
        <circle cx="30" cy="180" r="1"/>
      </g>
      <!-- Subtle fiber lines -->
      <g stroke="#D4A853" stroke-width="0.3" opacity="0.12">
        <line x1="0" y1="45" x2="200" y2="48"/>
        <line x1="0" y1="105" x2="200" y2="102"/>
        <line x1="0" y1="155" x2="200" y2="158"/>
      </g>
    </pattern>
    <!-- Cross-hatch for borders -->
    <pattern id="bannerHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3E2723" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <!-- Gold gradient -->
    <linearGradient id="bannerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C49A3C"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <!-- Dark vignette edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#F5E6C8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3E2723" stop-opacity="0.35"/>
    </radialGradient>
    <!-- Red gradient for title -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#8B2500"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="2560" height="1440" fill="url(#parchTex)"/>
  <rect width="2560" height="1440" fill="url(#bannerHatch)"/>
  <rect width="2560" height="1440" fill="url(#vignette)"/>

  <!-- Comic-style ink border / frame -->
  <rect x="20" y="20" width="2520" height="1400" rx="8" fill="none" stroke="#3E2723" stroke-width="6"/>
  <rect x="32" y="32" width="2496" height="1376" rx="5" fill="none" stroke="#C49A3C" stroke-width="2"/>
  <rect x="40" y="40" width="2480" height="1360" rx="3" fill="none" stroke="#5D4037" stroke-width="1" opacity="0.4"/>

  <!-- Decorative corner ink flourishes -->
  <g stroke="#3E2723" stroke-width="2.5" fill="none" opacity="0.6">
    <!-- Top-left -->
    <path d="M60,80 C70,60 80,55 100,50 M60,80 C55,95 50,105 50,120"/>
    <!-- Top-right -->
    <path d="M2500,80 C2490,60 2480,55 2460,50 M2500,80 C2505,95 2510,105 2510,120"/>
    <!-- Bottom-left -->
    <path d="M60,1360 C70,1380 80,1385 100,1390 M60,1360 C55,1345 50,1335 50,1320"/>
    <!-- Bottom-right -->
    <path d="M2500,1360 C2490,1380 2480,1385 2460,1390 M2500,1360 C2505,1345 2510,1335 2510,1320"/>
  </g>

  <!-- ==================== LEFT SIDE: Historical Silhouettes ==================== -->
  <g transform="translate(100, 580)" fill="#3E2723" opacity="0.85">

    <!-- Roman Soldier -->
    <g transform="translate(0, 0)">
      <!-- Helmet with crest -->
      <ellipse cx="60" cy="30" rx="22" ry="18" fill="#3E2723"/>
      <path d="M60,12 C55,0 50,-5 50,-2 C50,5 55,10 60,12 C65,10 70,5 70,-2 C70,-5 65,0 60,12" fill="#8B2500"/>
      <rect x="48" y="8" width="24" height="6" rx="3" fill="#3E2723"/>
      <!-- Crest plume -->
      <path d="M60,-2 C58,-30 52,-45 55,-50 C62,-42 65,-30 60,-2" fill="#C0392B"/>
      <!-- Body/armor -->
      <path d="M40,48 L38,120 L50,125 L55,90 L65,90 L70,125 L82,120 L80,48 Z" fill="#3E2723"/>
      <!-- Shield -->
      <ellipse cx="35" cy="85" rx="18" ry="30" fill="#8B2500" stroke="#3E2723" stroke-width="2"/>
      <line x1="35" y1="55" x2="35" y2="115" stroke="#D4A853" stroke-width="1.5"/>
      <line x1="17" y1="85" x2="53" y2="85" stroke="#D4A853" stroke-width="1.5"/>
      <!-- Spear -->
      <line x1="90" y1="-40" x2="90" y2="130" stroke="#5D4037" stroke-width="2.5"/>
      <path d="M85,-50 L90,-65 L95,-50 Z" fill="#C49A3C"/>
      <!-- Legs -->
      <line x1="52" y1="125" x2="48" y2="180" stroke="#3E2723" stroke-width="5"/>
      <line x1="68" y1="125" x2="72" y2="180" stroke="#3E2723" stroke-width="5"/>
      <!-- Sandals -->
      <rect x="42" y="178" width="14" height="6" rx="2" fill="#5D4037"/>
      <rect x="66" y="178" width="14" height="6" rx="2" fill="#5D4037"/>
    </g>

    <!-- Egyptian Pharaoh -->
    <g transform="translate(160, 10)">
      <!-- Nemes headdress -->
      <path d="M40,-20 L80,-20 L90,40 L75,30 L60,50 L45,30 L30,40 Z" fill="#D4A853" stroke="#3E2723" stroke-width="2"/>
      <path d="M50,-15 L70,-15 L72,5 L48,5 Z" fill="#C49A3C"/>
      <!-- Face -->
      <ellipse cx="60" cy="10" rx="15" ry="18" fill="#D4A853" stroke="#3E2723" stroke-width="1.5"/>
      <!-- Eyes -->
      <line x1="52" y1="8" x2="58" y2="8" stroke="#3E2723" stroke-width="1.5"/>
      <line x1="62" y1="8" x2="68" y2="8" stroke="#3E2723" stroke-width="1.5"/>
      <!-- Uraeus (cobra) -->
      <path d="M60,-22 C58,-35 55,-40 58,-42 C62,-40 60,-32 60,-22" fill="#D4A853" stroke="#3E2723" stroke-width="1"/>
      <!-- Body -->
      <path d="M42,35 L38,130 L82,130 L78,35 Z" fill="#3E2723"/>
      <!-- Crook and flail -->
      <path d="M35,50 C25,45 20,55 25,65 L35,80" fill="none" stroke="#D4A853" stroke-width="3"/>
      <line x1="85" y1="50" x2="95" y2="35" stroke="#D4A853" stroke-width="2.5"/>
      <g stroke="#D4A853" stroke-width="2">
        <line x1="95" y1="35" x2="100" y2="30"/>
        <line x1="95" y1="35" x2="102" y2="37"/>
        <line x1="95" y1="35" x2="100" y2="42"/>
      </g>
      <!-- Legs -->
      <rect x="45" y="130" width="10" height="40" fill="#3E2723"/>
      <rect x="65" y="130" width="10" height="40" fill="#3E2723"/>
    </g>

    <!-- Medieval Knight -->
    <g transform="translate(320, -10)">
      <!-- Helmet (great helm) -->
      <rect x="42" y="0" width="36" height="40" rx="5" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
      <line x1="42" y1="20" x2="78" y2="20" stroke="#3E2723" stroke-width="1"/>
      <rect x="50" y="22" width="20" height="4" rx="1" fill="#3E2723"/>
      <!-- Plume -->
      <path d="M60,0 C55,-15 50,-25 55,-30 C62,-22 65,-12 60,0" fill="#C0392B"/>
      <!-- Body armor -->
      <path d="M35,40 L30,140 L90,140 L85,40 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
      <!-- Chest cross/heraldry -->
      <line x1="60" y1="55" x2="60" y2="100" stroke="#C0392B" stroke-width="5"/>
      <line x1="42" y1="75" x2="78" y2="75" stroke="#C0392B" stroke-width="5"/>
      <!-- Sword -->
      <line x1="95" y1="30" x2="95" y2="160" stroke="#C49A3C" stroke-width="3"/>
      <line x1="85" y1="50" x2="105" y2="50" stroke="#C49A3C" stroke-width="3"/>
      <rect x="93" y="45" width="4" height="12" fill="#5D4037"/>
      <!-- Legs -->
      <rect x="42" y="140" width="14" height="50" fill="#5D4037"/>
      <rect x="64" y="140" width="14" height="50" fill="#5D4037"/>
    </g>

    <!-- Samurai -->
    <g transform="translate(480, -5)">
      <!-- Kabuto helmet -->
      <path d="M30,20 C30,0 90,0 90,20 L85,35 L35,35 Z" fill="#3E2723" stroke="#3E2723" stroke-width="2"/>
      <!-- Maedate (crest) -->
      <path d="M60,2 L55,-20 L60,-15 L65,-20 Z" fill="#D4A853"/>
      <!-- Menpo (face guard) -->
      <path d="M40,35 L40,50 L60,55 L80,50 L80,35 Z" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
      <!-- Shikoro (neck guard) -->
      <path d="M30,25 L20,35 M90,25 L100,35" stroke="#3E2723" stroke-width="3"/>
      <path d="M25,30 L15,42 M95,30 L105,42" stroke="#3E2723" stroke-width="2.5"/>
      <!-- Body/armor (do) -->
      <path d="M35,55 L28,140 L92,140 L85,55 Z" fill="#3E2723"/>
      <!-- Sode (shoulder guards) -->
      <rect x="15" y="55" width="22" height="30" rx="2" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
      <rect x="83" y="55" width="22" height="30" rx="2" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
      <!-- Katana -->
      <path d="M105,20 C108,60 110,120 108,170" fill="none" stroke="#C49A3C" stroke-width="2.5"/>
      <rect x="103" y="60" width="10" height="5" rx="1" fill="#5D4037"/>
      <!-- Legs -->
      <rect x="40" y="140" width="12" height="45" fill="#3E2723"/>
      <rect x="68" y="140" width="12" height="45" fill="#3E2723"/>
    </g>
  </g>

  <!-- Ink splatter near silhouettes -->
  <g fill="#3E2723" opacity="0.15">
    <circle cx="150" cy="800" r="3"/>
    <circle cx="155" cy="806" r="1.5"/>
    <circle cx="300" cy="790" r="2"/>
    <circle cx="680" cy="810" r="2.5"/>
    <circle cx="685" cy="815" r="1.2"/>
  </g>

  <!-- ==================== CENTER: Main Title ==================== -->
  <!-- Safe area reference (invisible): 507,508 to 2053,931 -->

  <!-- Decorative line above title -->
  <line x1="900" y1="620" x2="1660" y2="620" stroke="url(#bannerGold)" stroke-width="2"/>

  <!-- Small diamond ornaments -->
  <polygon points="890,620 885,625 890,630 895,625" fill="#D4A853"/>
  <polygon points="1670,620 1665,625 1670,630 1675,625" fill="#D4A853"/>

  <!-- Main title -->
  <text x="1280" y="710" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="110" font-weight="bold" letter-spacing="10" fill="url(#redGrad)"
        stroke="#3E2723" stroke-width="2">
    CRONICAS
  </text>
  <!-- Accent mark -->
  <text x="1107" y="670" text-anchor="middle" font-family="Georgia, serif" font-size="45" fill="#8B2500">&#x301;</text>

  <text x="1280" y="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="85" font-weight="bold" letter-spacing="18" fill="url(#bannerGold)"
        stroke="#5D4037" stroke-width="1.5">
    ILUSTRADAS
  </text>

  <!-- Decorative line below title -->
  <line x1="900" y1="830" x2="1660" y2="830" stroke="url(#bannerGold)" stroke-width="2"/>
  <polygon points="1280,826 1284,830 1280,834 1276,830" fill="#D4A853"/>

  <!-- Subtitle -->
  <text x="1280" y="885" text-anchor="middle" font-family="Georgia, serif"
        font-size="38" font-style="italic" fill="#5D4037" letter-spacing="4">
    Historia contada en vi&#xF1;etas
  </text>

  <!-- Decorative small flourish under subtitle -->
  <path d="M1220,900 C1240,910 1260,905 1280,910 C1300,905 1320,910 1340,900"
        fill="none" stroke="#C49A3C" stroke-width="1.5" opacity="0.6"/>

  <!-- ==================== RIGHT SIDE: Scrolls, Maps, Compass ==================== -->
  <g transform="translate(1900, 550)">

    <!-- Scroll 1 -->
    <g transform="translate(0, -50) rotate(-10)">
      <rect x="0" y="0" width="120" height="180" rx="3" fill="#F5E6C8" stroke="#3E2723" stroke-width="2"/>
      <!-- Scroll roll top -->
      <ellipse cx="60" cy="0" rx="65" ry="12" fill="#E8D5A8" stroke="#3E2723" stroke-width="2"/>
      <!-- Scroll roll bottom -->
      <ellipse cx="60" cy="180" rx="65" ry="12" fill="#E8D5A8" stroke="#3E2723" stroke-width="2"/>
      <!-- Faux text -->
      <g stroke="#5D4037" stroke-width="0.8" opacity="0.3">
        <line x1="15" y1="30" x2="105" y2="30"/>
        <line x1="15" y1="45" x2="100" y2="45"/>
        <line x1="15" y1="60" x2="105" y2="60"/>
        <line x1="15" y1="75" x2="90" y2="75"/>
        <line x1="15" y1="90" x2="105" y2="90"/>
        <line x1="15" y1="105" x2="95" y2="105"/>
        <line x1="15" y1="120" x2="105" y2="120"/>
        <line x1="15" y1="135" x2="100" y2="135"/>
        <line x1="15" y1="150" x2="80" y2="150"/>
      </g>
      <!-- Wax seal -->
      <circle cx="60" cy="160" r="12" fill="#8B2500" stroke="#3E2723" stroke-width="1"/>
      <circle cx="60" cy="160" r="7" fill="#C0392B"/>
    </g>

    <!-- Map element -->
    <g transform="translate(160, 20)">
      <rect x="0" y="0" width="180" height="140" rx="2" fill="#F5E6C8" stroke="#3E2723" stroke-width="2" transform="rotate(5)"/>
      <!-- Map coastline suggestion -->
      <path d="M30,20 C40,30 35,50 45,60 C55,50 50,70 60,80 C70,70 65,90 80,100 C90,85 100,95 110,80 C100,70 120,60 110,50 C100,55 95,40 85,35 C75,40 70,25 60,20 C50,30 40,15 30,20Z"
            fill="#E8D5A8" stroke="#5D4037" stroke-width="1.5" opacity="0.6" transform="rotate(5)"/>
      <!-- Map X mark -->
      <g transform="translate(80, 55) rotate(5)" stroke="#C0392B" stroke-width="2.5">
        <line x1="-8" y1="-8" x2="8" y2="8"/>
        <line x1="8" y1="-8" x2="-8" y2="8"/>
      </g>
      <!-- Dotted path on map -->
      <path d="M40,80 C50,75 60,70 80,55" fill="none" stroke="#8B2500" stroke-width="1.5" stroke-dasharray="4,3" transform="rotate(5)"/>
    </g>

    <!-- Compass -->
    <g transform="translate(250, 220)">
      <circle cx="60" cy="60" r="55" fill="#F5E6C8" stroke="#3E2723" stroke-width="2.5"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#C49A3C" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="45" fill="none" stroke="#5D4037" stroke-width="0.5" opacity="0.4"/>
      <!-- Cardinal points -->
      <text x="60" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#8B2500">N</text>
      <text x="60" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5D4037">S</text>
      <text x="20" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5D4037">O</text>
      <text x="100" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5D4037">E</text>
      <!-- Compass needle -->
      <polygon points="60,18 55,60 60,55 65,60" fill="#C0392B"/>
      <polygon points="60,102 55,60 60,65 65,60" fill="#3E2723"/>
      <!-- Center pin -->
      <circle cx="60" cy="60" r="4" fill="#D4A853" stroke="#3E2723" stroke-width="1"/>
      <!-- Tick marks -->
      <g stroke="#5D4037" stroke-width="1" opacity="0.5">
        <line x1="60" y1="12" x2="60" y2="16"/>
        <line x1="60" y1="104" x2="60" y2="108"/>
        <line x1="12" y1="60" x2="16" y2="60"/>
        <line x1="104" y1="60" x2="108" y2="60"/>
      </g>
    </g>

    <!-- Small scroll 2 -->
    <g transform="translate(100, 300) rotate(15)">
      <rect x="0" y="0" width="80" height="110" rx="2" fill="#F5E6C8" stroke="#3E2723" stroke-width="1.5"/>
      <ellipse cx="40" cy="0" rx="45" ry="8" fill="#E8D5A8" stroke="#3E2723" stroke-width="1.5"/>
      <ellipse cx="40" cy="110" rx="45" ry="8" fill="#E8D5A8" stroke="#3E2723" stroke-width="1.5"/>
      <g stroke="#5D4037" stroke-width="0.6" opacity="0.25">
        <line x1="12" y1="20" x2="68" y2="20"/>
        <line x1="12" y1="32" x2="65" y2="32"/>
        <line x1="12" y1="44" x2="68" y2="44"/>
        <line x1="12" y1="56" x2="60" y2="56"/>
        <line x1="12" y1="68" x2="68" y2="68"/>
        <line x1="12" y1="80" x2="55" y2="80"/>
      </g>
    </g>

    <!-- Quill pen accent -->
    <g transform="translate(380, 80) rotate(20)">
      <path d="M0,0 C-8,-35 -3,-70 0,-100 C3,-70 8,-35 0,0" fill="#D4A853" stroke="#3E2723" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="25" stroke="#5D4037" stroke-width="2"/>
      <path d="M-2,25 L0,38 L2,25" fill="#3E2723"/>
    </g>
  </g>

  <!-- Additional ink splatters for comic feel -->
  <g fill="#3E2723" opacity="0.12">
    <circle cx="2300" cy="900" r="3"/>
    <circle cx="2305" cy="907" r="1.5"/>
    <circle cx="2310" cy="903" r="1"/>
    <circle cx="1900" cy="1100" r="2"/>
    <circle cx="200" cy="400" r="2.5"/>
    <circle cx="207" cy="405" r="1.2"/>
  </g>

  <!-- Bottom decorative border strip -->
  <rect x="40" y="1360" width="2480" height="4" fill="url(#bannerGold)" opacity="0.4"/>

  <!-- Top decorative border strip -->
  <rect x="40" y="40" width="2480" height="4" fill="url(#bannerGold)" opacity="0.4"/>
</svg>