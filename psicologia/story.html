<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{width:1080px;height:1920px;overflow:hidden}
.card{width:1080px;height:1920px;position:relative;color:#fff;
  background:radial-gradient(circle at 25% 15%,#3a1030 0%,#1a0a1c 45%,#0d0710 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 70px;text-align:center}
.glow{position:absolute;border-radius:50%;filter:blur(8px)}
.g1{width:720px;height:720px;background:radial-gradient(circle,rgba(224,86,122,.32),transparent 70%);top:-160px;right:-180px}
.g2{width:640px;height:640px;background:radial-gradient(circle,rgba(139,92,246,.26),transparent 70%);bottom:-140px;left:-180px}
.brand{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:800;letter-spacing:.5px;
  color:#f0b6cb;margin-bottom:60px;z-index:2}
.brand .ic{font-size:52px}
.kicker{z-index:2;font-size:34px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:#e0567a;margin-bottom:30px}
h1{z-index:2;font-size:104px;line-height:1.04;font-weight:900;letter-spacing:-1px;margin-bottom:40px}
h1 .hl{background:linear-gradient(90deg,#e0567a,#b57cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{z-index:2;font-size:42px;color:#cbb8d6;line-height:1.4;margin-bottom:70px;max-width:820px}
.chips{z-index:2;display:flex;flex-direction:column;gap:22px;margin-bottom:80px;width:100%;max-width:760px}
.chip{background:rgba(224,86,122,.10);border:2px solid rgba(224,86,122,.35);border-radius:22px;
  padding:26px 32px;font-size:40px;font-weight:600;display:flex;align-items:center;gap:20px;color:#f3dbe6}
.url{z-index:2;background:linear-gradient(90deg,#e0567a,#b57cf6);color:#fff;font-size:52px;font-weight:900;
  padding:34px 60px;border-radius:26px;box-shadow:0 18px 50px rgba(224,86,122,.4)}
.swipe{z-index:2;margin-top:70px;font-size:38px;color:#f0b6cb;font-weight:700;animation:none}
.swipe .arrow{font-size:48px}
</style></head>
<body>
<div class="card">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="brand"><span class="ic">💬</span> Seducción e Infidelidades</div>
  <div class="kicker">Psicología femenina</div>
  <h1>¿Cómo saber si <span class="hl">te está engañando?</span></h1>
  <div class="sub">Las señales que la mayoría ignora… hasta que es tarde.</div>
  <div class="chips">
    <div class="chip">💔 10 señales de infidelidad</div>
    <div class="chip">🧠 Lo que ella no te dice</div>
    <div class="chip">🔍 Cómo detectar el engaño</div>
  </div>
  <div class="url">🌐 seduccion.pages.dev</div>
  <div class="swipe"><span class="arrow">👆</span> Toca el enlace y descúbrelo</div>
</div>
</body></html>
