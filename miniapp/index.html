<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Herramienta USB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{color-scheme:dark light;}
  *{box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;
       background:var(--tg-theme-bg-color,#0f1115);color:var(--tg-theme-text-color,#eee);}
  h1{font-size:1.2rem;margin:0 0 4px;}
  p.sub{color:var(--tg-theme-hint-color,#9aa0a6);font-size:.9rem;margin:0 0 16px;}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #333;
        background:var(--tg-theme-secondary-bg-color,#1b1e24);color:inherit;font-size:1rem;}
  button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;
         background:var(--tg-theme-button-color,#2ea6ff);color:var(--tg-theme-button-text-color,#fff);
         font-size:1rem;font-weight:600;}
  #result{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
  .card{padding:14px;border-radius:10px;background:#1b1e24;border:1px solid #2ea6ff;}
  .card.empty{border:1px solid #555;color:#aaa;}
  .card a{color:#2ea6ff;font-weight:600;word-break:break-all;}
  .meta{font-size:.85rem;color:#9aa0a6;margin-top:6px;}
  .count{font-size:.85rem;color:#9aa0a6;margin:14px 0 0;}
  .pager{display:flex;gap:10px;margin-top:14px;}
  .pager button{margin-top:0;flex:1;}
  .pager button:disabled{opacity:.4;}
  .pageinfo{text-align:center;font-size:.85rem;color:#9aa0a6;margin-top:8px;}
</style>
</head>
<body>
<h1>🔎 Buscador de herramienta USB</h1>
<p class="sub">Escribe la marca de tu USB (ej. Adata, Kingston, SanDisk...) o los datos de
ChipGenius: controlador, chip code o flash ID.</p>

<input id="q" type="text" placeholder="Ej: Adata / SMI 3268AB / Kingston..." autocomplete="off">
<button id="btnSearch">Buscar (con anuncio)</button>

<div id="result"></div>

<script>
const SITE_BASE = "https://dtechusb.pages.dev/";
const PAGE_SIZE = 5;
let ROWS = null;
let currentMatches = [];
let currentQ = "";
let currentPage = 0;

fetch("rows.json").then(r => r.json()).then(d => ROWS = d);

const MONETAG_REWARDED_ZONE = "REEMPLAZAR_CON_TU_ZONE_ID"; // <-- pon aquí tu zone id rewarded de Monetag

function showAd(){
  if(typeof window["show_" + MONETAG_REWARDED_ZONE] === "function" &&
     MONETAG_REWARDED_ZONE !== "REEMPLAZAR_CON_TU_ZONE_ID"){
    return window["show_" + MONETAG_REWARDED_ZONE]().catch(()=>{});
  }
  return Promise.resolve();
}

function haystack(row){
  // "memoria" (chip de flash interno) se excluye a propósito: su marca (ej. "SanDisk")
  // suele ser distinta a la marca real del USB (row.producto) y genera falsos positivos.
  return [row.producto, row.controlador, row.chip_code, row.flash_id, row.herramienta, row.pack]
    .join(' ').toLowerCase();
}

function renderPage(){
  const el = document.getElementById("result");
  if(!currentMatches.length){
    el.innerHTML = `<div class="card empty">
      <p>❌ No encontramos "<strong>${currentQ}</strong>" en la base de datos.</p>
      <p>Verifica el VID/PID, controlador o marca con
      <a href="${SITE_BASE}chipgenius.html" target="_blank" rel="noopener">ChipGenius</a>.</p>
    </div>`;
    return;
  }
  const totalPages = Math.ceil(currentMatches.length / PAGE_SIZE);
  const start = currentPage * PAGE_SIZE;
  const pageRows = currentMatches.slice(start, start + PAGE_SIZE);

  let html = `<p class="count">${currentMatches.length} resultado(s) para "${currentQ}"</p>`;
  pageRows.forEach(row => {
    html += `<div class="card">
      <p>Para <strong>${row.controlador || row.pack}</strong>
      ${row.producto ? ' (' + row.producto + ')' : ''}
      se usó la herramienta <strong>${row.herramienta || 'del pack ' + row.pack}</strong>.
      La puedes obtener en el pack de <strong>${row.pack}</strong> en nuestra web:</p>
      <a href="${SITE_BASE}${row.slug}.html" target="_blank" rel="noopener">
        Abrir pack de ${row.pack} →</a>
      <p class="meta">Chip code: ${row.chip_code || '—'} · Flash ID: ${row.flash_id || '—'}</p>
    </div>`;
  });

  if(totalPages > 1){
    html += `<div class="pager">
      <button id="btnPrev" ${currentPage === 0 ? 'disabled' : ''}>← Anterior</button>
      <button id="btnNext" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Siguiente →</button>
    </div>
    <p class="pageinfo">Página ${currentPage + 1} de ${totalPages}</p>`;
  }

  el.innerHTML = html;

  const prevBtn = document.getElementById("btnPrev");
  const nextBtn = document.getElementById("btnNext");
  if(prevBtn) prevBtn.addEventListener("click", () => changePage(currentPage - 1));
  if(nextBtn) nextBtn.addEventListener("click", () => changePage(currentPage + 1));
}

function changePage(page){
  showAd().then(() => {
    currentPage = page;
    renderPage();
  });
}

function doSearch(){
  const q = document.getElementById("q").value.trim();
  const el = document.getElementById("result");
  if(!q){ return; }
  if(!ROWS){ el.innerHTML = `<div class="card empty">Cargando datos, intenta de nuevo…</div>`; return; }

  currentQ = q;
  currentPage = 0;
  currentMatches = ROWS.filter(row => haystack(row).includes(q.toLowerCase()));
  renderPage();
}

function runRewardedThenSearch(){
  showAd().then(doSearch);
}

document.getElementById("btnSearch").addEventListener("click", runRewardedThenSearch);
document.getElementById("q").addEventListener("keydown", e => {
  if(e.key === "Enter") runRewardedThenSearch();
});

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
