<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outliers · Canales pequeños</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>📈 Outliers de canales pequeños</h1>
      <p class="subtitle">
        Videos con <strong>+100% de vistas</strong> sobre el promedio de su canal
        (&lt;10.000 suscriptores) · último mes
      </p>
      <div class="meta-row">
        <span id="updated-at">Cargando...</span>
        <span id="count-badge"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filters" id="niche-filters"></div>
    <div id="grid" class="grid"></div>
    <p id="empty-state" class="empty-state" hidden>
      No hay outliers todavía. Ejecuta <code>npm run fetch</code> para generar datos.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
