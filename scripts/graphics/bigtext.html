<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  }

  .stage {
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.82);
    position: relative;
  }

  .left-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: #e63946;
    transform: scaleY(0);
    transform-origin: bottom;
  }

  .text-wrap {
    max-width: 1480px;
    padding: 0 120px;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
  }

  .main-text {
    font-size: 72px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.18;
    text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }

  .highlight {
    color: #e63946;
  }

  @keyframes barIn {
    0%   { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }
  @keyframes textIn {
    0%   { opacity: 0; transform: translateY(30px); }
    55%  { opacity: 1; transform: translateY(-5px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .animate .left-bar  { animation: barIn  0.45s cubic-bezier(.22,1,.36,1) 0s   forwards; }
  .animate .text-wrap { animation: textIn 0.6s  cubic-bezier(.22,1,.36,1) 0.1s forwards; }
  .outro   .text-wrap { animation: fadeOut 0.35s ease forwards; }
  .outro   .left-bar  { animation: barIn 0.35s ease reverse forwards; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="left-bar"></div>
  <div class="text-wrap">
    <p class="main-text" id="mainText">No es que seas inteligente o no.<br>Es que <span class="highlight">nadie te enseñó</span> a pensar diferente.</p>
  </div>
</div>

<script>
  // ?text=...&highlight=...&duration=3
  // highlight= comma-separated phrases to color red
  const params    = new URLSearchParams(location.search);
  const text      = params.get('text')      || '';
  const highlight = (params.get('highlight') || '').split(',').map(s => s.trim()).filter(Boolean);
  const duration  = parseFloat(params.get('duration') || '3');

  if (text) {
    let html = text.replace(/\\n/g, '<br>');
    for (const h of highlight) {
      html = html.replace(new RegExp(h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
        `<span class="highlight">${h}</span>`);
    }
    document.getElementById('mainText').innerHTML = html;
  }

  window.__ready = false;
  requestAnimationFrame(() => {
    document.getElementById('stage').classList.add('animate');
    window.__ready = true;

    const outroDelay = Math.max(0, duration - 0.4) * 1000;
    setTimeout(() => {
      document.getElementById('stage').classList.remove('animate');
      document.getElementById('stage').classList.add('outro');
    }, outroDelay);
  });
</script>
</body>
</html>
