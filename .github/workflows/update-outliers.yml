name: Publicar sitio de outliers

on:
  push:
    branches: [claude/charming-bell-kl0c3i]
    paths:
      - "outlier-tracker/public/**"
      - "youtube-research-copilot/public/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar sitio combinado
        run: |
          mkdir -p site
          cp -r outlier-tracker/public/. site/
          mkdir -p site/research
          cp -r youtube-research-copilot/public/. site/research/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
