name: Publicar sitio de outliers

on:
  push:
    branches: [claude/charming-bell-kl0c3i]
    paths:
      - "outlier-tracker/public/**"
      - "youtube-research-copilot/public/**"
      - "trend-hunter/public/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar sitio combinado
        run: |
          mkdir -p site
          cp -r outlier-tracker/public/. site/
          mkdir -p site/research
          cp -r youtube-research-copilot/public/. site/research/
          mkdir -p site/trends
          cp -r trend-hunter/public/. site/trends/

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
